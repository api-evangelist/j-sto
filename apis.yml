name: Jüsto
description: Jüsto is a Mexican online-only supermarket founded in 2019 by Ricardo Weder, headquartered
  in Mexico City. It operates a direct-to-consumer grocery e-commerce and delivery model with no physical
  stores, sourcing produce and pantry goods directly from farmers, producers, and brands and fulfilling
  orders from micro-fulfillment dark stores. The company sells its catalog through web and mobile apps
  and has raised venture funding from investors including General Atlantic, SoftBank, Foundation Capital,
  and 500 Global. Jüsto has no public developer program or documented API surface; this profile is
  maintained in the API Evangelist network as a company record.
